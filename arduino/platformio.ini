; Stripe Revenue Display -- Arduino/PlatformIO port for the
; Waveshare ESP32-C6-Touch-AMOLED-2.16.
;
; Why this exists: the ESP-IDF build drives this panel through
; esp_lcd_sh8601 + esp_lv_adapter and renders exactly one frame, after which
; the glass never updates again while every call still returns ESP_OK. That
; was bisected to ground (see C6-HANDOFF.md) -- Waveshare's own example works
; on the same board, so the panel is fine and the fault is in our IDF
; integration. Rather than keep hunting it, the display layer moves to
; Arduino_GFX, which Clawdmeter demonstrably runs on this exact board.
;
; Every value below is copied from Clawdmeter's `waveshare_amoled_216_c6`
; environment, which is running hardware. Do not "clean these up" without
; testing on the glass -- several are load-bearing and non-obvious.

[env:c6_amoled]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; The board ships 16MB of flash. The default 1.25MB app partition cannot hold
; this firmware once LVGL and the twelve C6 fonts are linked in.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; The rendering core is SHARED with the ESP-IDF tree rather than copied.
;
; screens.c, hero_size.c, baseline.c, the layout headers and the twelve
; generated C6 fonts depend only on LVGL and arithmetic -- no ESP-IDF, no SPI,
; no panel -- so both builds compile the same files. That is deliberate: the
; host suite in firmware/test covers these (1,526 checks), and a copy here
; would drift out from under those tests. The fonts alone are 8.6MB; there
; should be exactly one of them.
build_src_filter =
    +<*>
    +<../../firmware/main/screens.c>
    +<../../firmware/main/hero_size.c>
    +<../../firmware/main/baseline.c>
    +<../../firmware/main/fonts/>
    ; The fetch/compute core, shared for the same reason as the renderer:
    ; pure C, no ESP-IDF, and covered by the host suite (jsonstream alone has
    ; 18 checks feeding every chunk boundary, which is where hand-rolled
    ; streaming parsers break).
    +<../../firmware/main/jsonstream.c>
    +<../../firmware/main/mrr.c>
    +<../../firmware/main/format.c>
    ; Provisioning validation: pure logic, and the customer-facing error
    ; strings live here. Shared so the portal says the same thing on both
    ; builds, and so test_provision/test_stripe_key keep covering it.
    +<../../firmware/main/provision.c>
    +<../../firmware/main/stripe_key.c>
    ; Which screens are worth showing (spec 6.1) -- notably, no TRIALS screen
    ; for an account with no trials. Covered by test_rotation.
    +<../../firmware/main/rotation.c>
    ; The 30-day series behind the card's delta. Refuses to report a trend
    ; under seven samples; covered by test_history.
    +<../../firmware/main/history.c>

build_flags =
    -I../firmware/main
    -I../firmware/main/fonts
    ; The C6 has only USB-Serial-JTAG (HWCDC), no native USB-OTG. The Arduino
    ; core maps Serial -> HWCDCSerial only when BOTH flags are set. CDC_ON_BOOT
    ; alone selects USBSerial (TinyUSB), which does not exist on the C6 and
    ; breaks the build; with neither, Serial goes to UART0 on physical pins and
    ; nothing reaches the USB host.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; No -DBOARD_HAS_PSRAM: the C6 has none. This is the constraint the whole
    ; streaming-JSON design exists to satisfy.
    -DXPOWERS_CHIP_AXP2101
    ; LVGL is configured by build flags rather than a vendored lv_conf.h, so
    ; the host test harness and the device agree without a second copy.
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_LABEL=1
    -DLV_USE_OBJ=1
    -DLV_USE_LINE=1
    -DLV_TICK_CUSTOM=1
    ; LV_CONF_SKIP makes every unset option take its "no config" default, and
    ; for the built-in fonts that default is 0 -- no glyphs are compiled in, so
    ; labels draw nothing at all. This cost a flash cycle: solid fills reached
    ; the glass while text did not, which looks exactly like a broken flush
    ; path. Montserrat 14 is the font LV_FONT_DEFAULT points at, so it has to
    ; be on even though the deck uses its own generated faces.
    -DLV_FONT_MONTSERRAT_14=1
    ; Same reason: the default theme is off under LV_CONF_SKIP, which leaves
    ; objects with no base style.
    -DLV_USE_THEME_DEFAULT=1
    -DLV_USE_THEME_SIMPLE=1
    ; A full-frame RGB565 snapshot is ~460KB on 480x480 and does not fit in C6
    ; internal SRAM.
    -DLV_USE_SNAPSHOT=0
    ; Our own layout selection, mirroring layout.h on the IDF side.
    -DBOARD_C6_AMOLED_216

lib_deps =
    ; 1.6.4+ ships Arduino_CO5300, the controller on this panel.
    moononournation/GFX Library for Arduino@^1.6.4
    lewisxhe/XPowersLib@^0.2.7
    lvgl/lvgl@^9.2.0
